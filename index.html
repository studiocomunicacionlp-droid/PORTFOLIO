<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ============================================================
       META & SEO — Los valores se controlan desde content/texts.js
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="meta-desc"    name="description" content="" />
  <meta id="meta-keys"    name="keywords"    content="" />
  <meta id="meta-author"  name="author"      content="" />
  <!-- Open Graph -->
  <meta property="og:type"  content="website" />
  <meta id="og-title"       property="og:title"       content="" />
  <meta id="og-description" property="og:description" content="" />
  <title id="page-title">Portfolio</title>

  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── CURSOR CUSTOM ────────────────────────────────────────── -->
<div class="cursor"></div>
<div class="cursor-follower"></div>

<!-- ── NAVBAR ────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="container nav-inner">
    <!-- Logo: cambiar texto en content/texts.js → footer.name -->
    <a href="#" class="nav-logo" id="nav-logo">JP<span>.</span></a>

    <ul class="nav-links" id="nav-links">
      <li><a href="#about">Sobre mí</a></li>
      <li><a href="#services">Servicios</a></li>
      <li><a href="#pricing">Precios</a></li>
      <li><a href="#portfolio">Trabajos</a></li>
      <li><a href="#contact">Contacto</a></li>
    </ul>

    <a href="#contact" class="btn btn-primary nav-cta">Hablemos</a>

    <!-- Botón hamburguesa (mobile) -->
    <button class="nav-toggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Menú mobile -->
<div class="mobile-menu">
  <button class="mobile-close" aria-label="Cerrar menú">✕</button>
  <a href="#about">Sobre mí</a>
  <a href="#services">Servicios</a>
  <a href="#pricing">Precios</a>
  <a href="#portfolio">Trabajos</a>
  <a href="#youtube">YouTube</a>
  <a href="#contact">Contacto</a>
  <a href="#contact" class="btn btn-primary">Hablemos</a>
</div>

<!-- ================================================================
     HERO SECTION
     ================================================================ -->
<section class="hero" id="home">
  <!-- Fondo decorativo -->
  <div class="hero-bg">
    <div class="hero-grid"></div>
    <div class="hero-orb hero-orb-1"></div>
    <div class="hero-orb hero-orb-2"></div>
    <div class="hero-orb hero-orb-3"></div>
  </div>

  <div class="container hero-inner">

    <!-- Contenido izquierdo -->
    <div class="hero-content">
      <!-- Badge "disponible" — editar en texts.js → hero.badge -->
      <div class="hero-badge" id="hero-badge">
        <span class="hero-badge-dot"></span>
        <span id="hero-badge-text"></span>
      </div>

      <!-- Nombre: texts.js → hero.name -->
      <h1 class="hero-name" id="hero-name"></h1>

      <!-- Profesión: texts.js → hero.profession -->
      <p class="hero-profession" id="hero-profession"></p>

      <!-- Tagline: texts.js → hero.tagline -->
      <p class="hero-tagline" id="hero-tagline"></p>

      <!-- Botones: texts.js → hero.cta_primary / cta_secondary -->
      <div class="hero-actions">
        <a href="#contact" class="btn btn-primary" id="hero-cta-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span></span>
        </a>
        <a href="#portfolio" class="btn btn-secondary" id="hero-cta-secondary">
          <span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </a>
      </div>

      <!-- Mini-stats -->
      <div class="hero-stats" id="hero-stats"></div>
    </div>

    <!-- Visual / Foto -->
    <div class="hero-visual">
      <div class="hero-photo-wrapper">
        <div class="hero-photo-ring"></div>
        <!-- Si hay foto → se muestra <img>; si no → placeholder -->
        <div id="hero-photo-container"></div>

        <!-- Tarjetas flotantes -->
        <div class="hero-float-card hero-float-1">
          <div class="hf-label">Videos editados</div>
          <div class="hf-value">5.000<span style="color:var(--accent)">+</span></div>
        </div>
        <div class="hero-float-card hero-float-2">
          <div class="hf-label">Clientes que repiten</div>
          <div class="hf-value green">98%</div>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ================================================================
     SOBRE MÍ
     ================================================================ -->
<section class="about section" id="about">
  <div class="container about-inner">

    <!-- Foto about -->
    <div class="about-photo-wrapper reveal-left">
      <div id="about-photo-container"></div>
      <div class="about-deco"></div>
    </div>

    <!-- Contenido -->
    <div class="about-content reveal-right">
      <div class="badge" id="about-badge"></div>
      <h2 id="about-headline"></h2>
      <p id="about-story"></p>
      <p id="about-story2"></p>

      <!-- Diferenciales -->
      <div class="about-differentials" id="about-differentials"></div>

      <!-- Experiencia -->
      <div class="about-experience">
        <div id="about-experience-list"></div>
      </div>
    </div>

  </div>
</section>

<!-- ================================================================
     SERVICIOS
     ================================================================ -->
<section class="services section" id="services">
  <div class="container">
    <div class="section-header reveal">
      <div class="badge" id="services-badge"></div>
      <h2 id="services-headline"></h2>
      <p id="services-subtitle"></p>
    </div>
    <!-- Cards generadas por JS desde texts.js → services.items -->
    <div class="services-grid" id="services-grid"></div>
  </div>
</section>

<!-- ================================================================
     PRECIOS / PRICING
     ================================================================ -->
<section class="pricing section" id="pricing">
  <div class="container">
    <div class="section-header reveal">
      <div class="badge" id="pricing-badge"></div>
      <h2 id="pricing-headline"></h2>
      <p id="pricing-subtitle"></p>
    </div>

    <!-- Grilla principal de precios -->
    <div class="pricing-main">
      <!-- Columnas Marcas + Producto (generadas por JS) -->
      <div class="pricing-cols" id="pricing-cols"></div>

      <!-- Card Pack Mensual Máximo -->
      <div class="pricing-mensual-card reveal" id="pricing-mensual"></div>
    </div>

    <!-- Extras -->
    <div class="pricing-extras reveal" id="pricing-extras"></div>
  </div>
</section>

<!-- ================================================================
     YOUTUBE
     ================================================================ -->
<section class="youtube-section section" id="youtube">
  <div class="container">
    <div class="youtube-inner">
      <div class="youtube-content reveal-left">
        <div class="badge" id="youtube-badge"></div>
        <h2 id="youtube-headline"></h2>
        <p id="youtube-subtitle"></p>
        <div class="youtube-features" id="youtube-features"></div>
        <p class="youtube-note" id="youtube-note"></p>
        <a href="#contact" class="btn btn-primary" id="youtube-cta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span></span>
        </a>
      </div>
      <div class="youtube-visual reveal-right">
        <div class="yt-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor" class="yt-logo">
            <path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58z"/>
            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/>
          </svg>
          <div class="yt-orb"></div>
        </div>
        <div class="yt-badge-card">
          <div class="hf-label">Precio</div>
          <div class="hf-value" style="color:var(--accent)">A convenir</div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ================================================================
     PORTFOLIO
     ================================================================ -->
<section class="portfolio section" id="portfolio">
  <div class="container">
    <div class="section-header reveal">
      <div class="badge" id="portfolio-badge"></div>
      <h2 id="portfolio-headline"></h2>
      <p id="portfolio-subtitle"></p>
    </div>

    <!-- Filtros: generados desde texts.js → portfolio.categories -->
    <div class="portfolio-filters" id="portfolio-filters"></div>

    <!-- Grid: generado desde texts.js → portfolio.items -->
    <div class="portfolio-grid" id="portfolio-grid"></div>
  </div>
</section>

<!-- ================================================================
     TESTIMONIOS
     ================================================================ -->
<section class="testimonials section" id="testimonials">
  <div class="container">
    <div class="section-header reveal">
      <div class="badge" id="testimonials-badge"></div>
      <h2 id="testimonials-headline"></h2>
    </div>

    <div class="testimonials-slider-wrapper">
      <div class="testimonials-track" id="testimonials-track"></div>
    </div>

    <div class="slider-controls">
      <button class="slider-btn slider-prev" aria-label="Anterior">&#8592;</button>
      <div class="slider-dots" id="slider-dots"></div>
      <button class="slider-btn slider-next" aria-label="Siguiente">&#8594;</button>
    </div>
  </div>
</section>

<!-- ================================================================
     MÉTRICAS
     ================================================================ -->
<section class="metrics" id="metrics">
  <div class="container">
    <div class="section-header reveal">
      <div class="badge" id="metrics-badge"></div>
      <h2 id="metrics-headline"></h2>
    </div>
    <!-- Métricas: generadas desde texts.js → metrics.items -->
    <div class="metrics-grid" id="metrics-grid"></div>
  </div>
</section>

<!-- ================================================================
     CONTACTO / CTA
     ================================================================ -->
<section class="contact section" id="contact">
  <div class="container contact-inner">

    <!-- Info izquierda -->
    <div class="contact-info reveal-left">
      <div class="badge" id="contact-badge"></div>
      <h2 id="contact-headline"></h2>
      <p id="contact-subtitle"></p>

      <div class="contact-items" id="contact-items"></div>

      <!-- Botón WhatsApp -->
      <a href="#" class="wa-btn" id="wa-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
        </svg>
        <span id="wa-btn-text">Escribir por WhatsApp</span>
      </a>
    </div>

    <!-- Formulario derecha -->
    <div class="reveal-right">
      <form class="contact-form contact-form-el" id="contact-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="input-name" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="input-email" required />
          </div>
        </div>
        <div class="form-group">
          <label>Servicio</label>
          <select id="input-service"></select>
        </div>
        <div class="form-group">
          <label>Mensaje</label>
          <textarea id="input-message" rows="5"></textarea>
        </div>
        <button type="submit" class="form-submit" id="form-submit"></button>
        <div class="form-success" id="form-success"></div>
      </form>
    </div>

  </div>
</section>

<!-- ================================================================
     FOOTER
     ================================================================ -->
<footer class="footer">
  <div class="container">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="nav-logo" id="footer-logo">JP<span>.</span></div>
        <p id="footer-tagline"></p>
      </div>
      <!-- Redes sociales: editar en texts.js → footer.social -->
      <div class="footer-social" id="footer-social"></div>
    </div>
    <div class="footer-bottom" id="footer-copyright"></div>
  </div>
</footer>

<!-- Scroll to top -->
<button class="scroll-top" aria-label="Volver arriba">&#8593;</button>

<!-- ============================================================
     SCRIPTS
     1. content/texts.js — todos los textos editables
     2. js/main.js       — interactividad
     ============================================================ -->
<script src="content/texts.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>

</body>
</html>
